name: CI

on:
  push:
    branches: [snapshot, main]
  pull_request:
    branches: [snapshot, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Baut die publizierten Pakete in topologischer Reihenfolge (Core
      # vor den Erweiterungen — die prüfen gegen dessen dist-Typen). Der
      # Build enthält je Paket bereits den Typecheck (vue-tsc --noEmit).
      # apps/* bleiben außen vor: apps/editor hängt an @emfts/command,
      # das bisher nur als lokaler file:-Verweis existiert.
      - name: Build packages
        run: npm run build:packages

      - name: Test
        run: npm run test:run

      - name: Upload build artifacts
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist/
          retention-days: 30
